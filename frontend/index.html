<!DOCTYPE html>
<html lang="fr">                                  <!-- racine de la page, contenu en français -->
<head>                                            <!-- infos invisibles : réglages, titre, CSS -->
  <meta charset="UTF-8">                          <!-- encodage : permet d'afficher les accents -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"> <!-- adapte la page à la largeur du téléphone -->
  <title>Mercasport</title>                       <!-- titre affiché dans l'onglet du navigateur -->
  <link rel="stylesheet" href="css/style.css">        <!-- relie le fichier de style -->
</head>

<body>                                            <!-- tout ce qui est visible dans la page -->

  <header>                                        <!-- en-tête du site -->
    <h1>Bienvenue sur Mercasport</h1>             <!-- titre principal (un seul h1 par page) -->
  </header>

  <nav>                                           <!-- barre de navigation -->
    <ul>                                          <!-- liste non ordonnée de liens -->
      <li><a href="index.html">Accueil</a></li>   <!-- chaque lien est dans un <li> -->
      <li><a href="#ads-list">Offres</a></li>   <!-- vers la page de toutes les offres -->
      <li><a href="actualites.html">Actualités</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html">Se connecter</a></li>
      <li><a href="register.html">S'inscrire</a></li>
    </ul>
  </nav>

  <section class="search">                        <!-- zone de recherche ; "class" sert au style CSS -->
    <h2>Démarrez votre carrière professionnelle ici</h2> <!-- titre de la section -->
    <form action="#" method="get">                <!-- formulaire de recherche -->
      <input type="text" name="keywords" placeholder="Mot-clés">      <!-- champ : mots-clés -->
      <input type="text" name="location" placeholder="Localisation">  <!-- champ : lieu -->
      <input type="text" name="company" placeholder="Club">           <!-- champ : club -->
      <button type="submit">Rechercher</button>   <!-- envoie le formulaire (recharge la page pour l'instant) -->
    </form>
  </section>

  <section class="job-listings">                  <!-- zone des offres -->
    <h2>Dernières offres</h2>
    <ul id="ads-list"></ul>                       <!-- liste VIDE : le JS y crée une carte par offre.
                                                       Son id doit être identique à getElementById("ads-list") -->
  </section>

  <dialog id="ads-detail">                        <!-- la modale, cachée par défaut.
                                                       JS : getElementById("ads-detail"), showModal() / close() -->
    <div class="ads-inner">

        <button id="x-detail" aria-label="Fermer la fenêtre">&#10005;</button>
                                                  <!-- la croix. &#10005; = symbole ✕ ;
                                                       aria-label = texte lu par les lecteurs d'écran ;
                                                       JS : getElementById("x-detail"). Hors de la div ci-dessous,
                                                       donc elle n'est jamais effacée -->
        <div id="ads-content"></div>                  <!-- zone de contenu : JS la vide et la remplit à chaque clic.
                                                       JS : getElementById("ads-content") -->
    </div>
  </dialog>

  <footer>                                        <!-- pied de page -->
    <p>© 2026 MERCASPORT</p>
  </footer>

  <script type="module" src="js/app.mjs"></script>               <!-- charge le JS EN DERNIER : les éléments ci-dessus existent déjà -->
</body>
</html>
